<div class="prize-page" dir="ltr">
  <div class="header-section">
    <h1 class="page-title">Exquisite Prizes</h1>
    <p class="subtitle">Every donation is a step towards giving. Choose your prize.</p>
    
    <div class="header-actions">
      <a routerLink="/about" class="about-link">
        <i class="pi pi-info-circle"></i> Learn about LifeIsGiving
      </a>

      @if (isAdmin()) {
        <button class="add-btn" (click)="addPrize()">
          <i class="pi pi-plus"></i>
          <span>הוספת פרס חדש</span>
        </button>
      }
    </div>
  </div>

  <div class="cards-grid">
    @for (prize of prizes(); track prize.id) {
      <div class="card-item">
        <p-card styleClass="custom-product-card">
          
          @if (isAdmin()) {
            <div class="admin-floating-controls">
              <button class="admin-btn lottery" (click)="onRunLottery(prize, $event)" title="Run Lottery" 
                      style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; margin-right: 5px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);">
                <i class="pi pi-ticket"></i>
              </button>

              <button class="admin-btn purchases" (click)="viewPurchases(prize, $event)" title="View Purchasers" style="background-color: #6366f1; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; margin-right: 5px;">
                <i class="pi pi-users"></i>
              </button>

              <button class="admin-btn edit" (click)="editPrize(prize, $event)" title="Edit Prize">
                <i class="pi pi-pencil"></i>
              </button>
              
              <button class="admin-btn delete" (click)="deletePrize(prize.id, $event)" title="Delete Prize">
                <i class="pi pi-trash"></i>
              </button>
            </div>
          }

          <div class="price-badge">{{ prize.price }} ₪</div>
          
          <div class="image-header" [routerLink]="['/prizes', prize.id]">
            <img
              [src]="prize.imageUrl || 'assets/gift-placeholder.png'"
              [alt]="prize.name"
              class="product-image"
            />
            <div class="image-overlay">
              <span>View Details</span>
            </div>
          </div>

          <div class="card-content">
            <span class="category-text">{{ prize.category }}</span>
            <h3 class="prize-name" [routerLink]="['/prizes', prize.id]">{{ prize.name }}</h3>

            <div class="actions-group">
              <p-button
                label="Add to Cart"
                icon="pi pi-shopping-bag"
                class="full-width-btn"
                (onClick)="addToCart(prize, $event)"
              ></p-button>

              <button
                type="button"
                class="wishlist-btn"
                (click)="toggleFavorite(prize, $event)"
                title="Add to wishlist"
              >
                <i class="pi pi-heart"></i>
              </button>
            </div>
          </div>
        </p-card>
      </div>
    }
  </div>
</div>
