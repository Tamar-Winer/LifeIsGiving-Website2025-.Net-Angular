<ng-container *ngIf="prize; else loading">
  <div class="luxury-details-page" dir="ltr">
    <div class="breadcrumb-nav">
      <a routerLink="/prizes" class="back-link">
        <i class="pi pi-arrow-left"></i>
        <span>Back to Prizes Gallery</span>
      </a>
    </div>

    <p-card styleClass="premium-glass-card">
      <div class="main-grid">
        <div class="media-column">
          <div class="image-container">
            <div class="floating-price">{{ prize.price }} ₪</div>
            <img
              class="hero-image"
              [src]="prize.imageUrl || 'assets/gift-placeholder.png'"
              [alt]="prize.name"
            />
          </div>
        </div>

        <div class="info-column">
          <div class="content-header">
            <span class="category-tag">{{ prize.category }}</span>
            <h1 class="main-title">{{ prize.name }}</h1>
            <div class="status-badge">
              <span class="dot"></span> Active Raffle
            </div>
          </div>

          <p-divider></p-divider>

          <div class="description-area">
            <h3 class="section-subtitle">About this prize</h3>
            <p class="text">{{ prize.description }}</p>
          </div>

          <div class="specs-row">
            <div class="spec-box">
              <i class="pi pi-th-large"></i>
              <div class="spec-text">
                <span class="label">Category</span>
                <span class="val">{{ prize.category }}</span>
              </div>
            </div>
            <div class="spec-box">
              <i class="pi pi-user"></i>
              <div class="spec-text">
                <span class="label">Donor ID</span>
                <span class="val">#{{ prize.donorId }}</span>
              </div>
            </div>
          </div>

          <div class="action-zone">
            <div class="buttons-wrapper">
              <p-button
                label="ADD TO CART"
                icon="pi pi-shopping-bag"
                styleClass="cta-button"
                (onClick)="addToCart()"
              ></p-button>

              <button type="button" class="heart-btn">
                <i class="pi pi-heart"></i>
              </button>
            </div>
            
            <div class="security-footer">
              <span><i class="pi pi-shield"></i> Secure Checkout</span>
              <span><i class="pi pi-verified"></i> Legal Supervision</span>
            </div>
          </div>
        </div>
      </div>
    </p-card>
  </div>
</ng-container>

<ng-template #loading>
  <div class="luxury-details-page">
    <p-card styleClass="premium-glass-card">
      <div class="main-grid">
        <div class="media-column">
          <p-skeleton width="100%" height="500px" borderRadius="30px"></p-skeleton>
        </div>
        <div class="info-column">
          <p-skeleton width="30%" height="20px" styleClass="mb-3"></p-skeleton>
          <p-skeleton width="70%" height="50px" styleClass="mb-5"></p-skeleton>
          <p-skeleton width="100%" height="120px" styleClass="mb-5"></p-skeleton>
          <div class="specs-row">
            <p-skeleton width="100%" height="60px" borderRadius="15px"></p-skeleton>
            <p-skeleton width="100%" height="60px" borderRadius="15px"></p-skeleton>
          </div>
        </div>
      </div>
    </p-card>
  </div>
</ng-template>
