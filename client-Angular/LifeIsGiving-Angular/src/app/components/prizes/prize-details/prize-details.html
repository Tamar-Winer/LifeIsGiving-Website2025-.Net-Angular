<ng-container *ngIf="prize; else loading">
  <div class="luxury-details-page" dir="ltr">
    <div class="breadcrumb-nav">
      <a routerLink="/prizes" class="back-link">
        <i class="pi pi-arrow-left"></i>
        <span>Back to Prizes Gallery</span>
      </a>
    </div>

    <p-card styleClass="premium-glass-card">
      <div class="main-grid">
        <div class="media-column">
          <div class="image-container">
            <div class="floating-price">{{ prize.price }} $</div>
            <img class="hero-image" [src]="prize.imageUrl || 'assets/gift-placeholder.png'" [alt]="prize.name" />
          </div>
        </div>

        <div class="info-column">
          <div class="content-header">
            <span class="category-tag">{{ categoryNames[prize.category] }}</span>
            <h1 class="main-title">{{ prize.name }}</h1>
            <div class="status-badge" [class.completed]="!prize.canPurchase">
              <span class="dot"></span>
              <ng-container *ngIf="prize.canPurchase; else drawnTemplate">
                Active Raffle
              </ng-container>
              <ng-template #drawnTemplate>
                Raffle Completed
              </ng-template>
            </div>
          </div>

          <p-divider></p-divider>

          <div class="description-area">
            <h3 class="section-subtitle">About this prize:</h3>
            <p class="text">{{ prize.description }}</p>
          </div>

          <div class="specs-row">
            <div class="spec-box">
              <i class="pi pi-th-large"></i>
              <div class="spec-text">
                <span class="label">Category</span>
                <span class="val">{{ categoryNames[prize.category] }}</span>
              </div>
            </div>
            <div class="spec-box">
              <i class="pi pi-user"></i>
              <div class="spec-text">
                <span class="label">Donor Name</span>
                <span class="val">{{ prize.donorName }}</span>
              </div>
            </div>
          </div>

          <div class="action-zone">
            <div class="buttons-wrapper">
              <p-button label="ADD TO CART" icon="pi pi-shopping-bag" styleClass="luxury-cta"
                (click)="addToCart(prize, $event)"></p-button>

              <button type="button" class="heart-btn">
                <i class="pi pi-heart"></i>
              </button>
            </div>

            <div class="security-footer">
              <span><i class="pi pi-shield"></i> Secure Checkout</span>
              <span><i class="pi pi-verified"></i> Legal Supervision</span>
            </div>
          </div>
        </div>
      </div>
    </p-card>
  </div>
</ng-container>

<ng-template #loading>
</ng-template>

<p-toast position="bottom-right"></p-toast>
