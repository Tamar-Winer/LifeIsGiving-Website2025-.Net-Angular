<div class="prize-dialog-container">
  <button class="close-btn" (click)="closeDialog()" title="Close">
    <i class="pi pi-times"></i>
  </button>

  <div class="prize-dialog-content">
    <p-toast position="top-center"></p-toast>

    <div class="auth-header">
      <h1 class="shine-title">
        {{ isEditMode ? 'Edit' : 'Create' }} <span>Prize</span>
      </h1>
      <p class="subtitle">Complete the details below to update the collection</p>
      <div class="header-divider"></div>
    </div>

    <form [formGroup]="prizeForm" (ngSubmit)="savePrize()" class="auth-form">
      
      <div class="field" [class.field-error]="prizeForm.get('name')?.invalid && prizeForm.get('name')?.touched">
        <label>Prize Name</label>
        <div class="input-wrapper">
          <i class="pi pi-tag"></i>
          <input pInputText formControlName="name" class="custom-input" placeholder="Enter prize name" />
        </div>
      </div>

      <div class="form-row">
        <div class="field flex-1">
          <label>Category</label>
          <div class="input-wrapper">
            <i class="pi pi-list"></i>
            <select formControlName="category" class="custom-input custom-select">
              <option [ngValue]="null" disabled selected>Select Category</option>
              @for (cat of categories; track cat.value) {
                <option [ngValue]="cat.value">{{ cat.label }}</option>
              }
            </select>
          </div>
        </div>

        <div class="field flex-1">
          <label>Price</label>
          <div class="input-wrapper price-wrapper">
            <i class="pi pi-dollar"></i>
            <p-inputNumber 
              formControlName="price" 
              styleClass="w-full"
              inputStyleClass="custom-input" 
              mode="currency" 
              currency="USD" 
              locale="en-US"
              placeholder="0.00">
            </p-inputNumber>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Donor</label>
        <div class="input-wrapper">
          <i class="pi pi-user"></i>
          <select formControlName="donorId" class="custom-input custom-select">
            <option [ngValue]="null" disabled selected>Choose a donor...</option>
            @for (donor of donors; track donor.id) {
              <option [ngValue]="donor.id">
                {{ donor.name }} 
              </option>
            }
          </select>
        </div>
      </div>

      <div class="field">
        <label>Description</label>
        <textarea formControlName="description" class="custom-input" rows="3" placeholder="Tell us about this prize..."></textarea>
      </div>

      <div class="field">
        <label>Prize Image</label>
        <div class="image-options">
          <div class="file-upload-wrapper">
            <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/*" hidden #fileInput>
            <button type="button" class="upload-btn" (click)="fileInput.click()">
              <i class="pi pi-cloud-upload"></i> Choose File
            </button>
            @if (selectedFileName) {
              <span class="file-name" [title]="selectedFileName">{{ selectedFileName }}</span>
            }
          </div>
          <div class="separator"><span>OR</span></div>
          <div class="input-wrapper">
            <i class="pi pi-link"></i>
            <input pInputText formControlName="imageUrl" class="custom-input" placeholder="Paste image URL here" />
          </div>
        </div>
      </div>

      <button type="submit" class="auth-btn" [disabled]="loading || prizeForm.invalid">
        @if (!loading) {
          <div class="btn-content">
            <span>{{ isEditMode ? 'UPDATE PRIZE' : 'CREATE PRIZE' }}</span>
            <i class="pi pi-arrow-right"></i>
          </div>
        } @else {
          <i class="pi pi-spin pi-spinner"></i>
        }
      </button>
    </form>
  </div>
</div>
