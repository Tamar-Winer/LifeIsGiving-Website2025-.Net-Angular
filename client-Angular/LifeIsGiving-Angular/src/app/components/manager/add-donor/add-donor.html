<p-toast></p-toast>

<div class="luxury-dialog">
  <button type="button" class="close-btn" (click)="close()">✕</button>

  <div class="auth-header">
    <h2 class="shine-title">Add <span>Donor</span></h2>
    <p class="subtitle">Partner with us for a better future</p>
    <div class="header-divider"></div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="grid-layout">
      
      <div class="field">
        <label>Username</label>
        <div class="input-wrapper">
          <i class="pi pi-user"></i>
          <input type="text" formControlName="userName" class="custom-input" 
                 [class.invalid]="form.controls.userName.touched && form.controls.userName.invalid" />
        </div>
        @if (form.controls.userName.touched && form.controls.userName.invalid) {
          <span class="error-hint">Min 3 characters required</span>
        }
      </div>

      <div class="field">
        <label>Full Name</label>
        <div class="input-wrapper">
          <i class="pi pi-id-card"></i>
          <input type="text" formControlName="name" class="custom-input"
                 [class.invalid]="form.controls.name.touched && form.controls.name.invalid" />
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="pi pi-envelope"></i>
          <input type="email" formControlName="email" class="custom-input"
                 [class.invalid]="form.controls.email.touched && form.controls.email.invalid" />
        </div>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="error-hint">Valid email required</span>
        }
      </div>

      <div class="field">
        <label>Security Password</label>
        <div class="input-wrapper">
          <i class="pi pi-lock"></i>
          <input type="password" formControlName="password" class="custom-input"
                 [class.invalid]="form.controls.password.touched && form.controls.password.invalid" />
        </div>
      </div>
    </div>

    <button type="submit" class="auth-btn" [disabled]="loading">
      <i class="pi pi-spin pi-spinner" *ngIf="loading"></i>
      {{ loading ? 'SAVING...' : 'CREATE DONOR' }}
    </button>
  </form>
</div>
