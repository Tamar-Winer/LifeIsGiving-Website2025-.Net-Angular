<!-- Overlay -->
<div class="overlay" (click)="close()" aria-hidden="true"></div>

<!-- Dialog -->
<div class="dialog" role="dialog" aria-modal="true" aria-label="Add donor dialog">
  <div class="dialog-header">
    <div class="title-wrap">
      <h2 class="title">הוספת תורם</h2>
      <p class="subtitle">מלאי פרטים והמערכת תיצור תורם חדש (role=3)</p>
    </div>

    <button type="button" class="icon-btn" (click)="close()" aria-label="סגור">
      ✕
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-body">
    <!-- Alerts -->
    <div class="alert error" *ngIf="errorMsg">
      <span class="dot"></span>
      <div class="alert-text">{{ errorMsg }}</div>
    </div>

    <div class="alert success" *ngIf="successMsg">
      <span class="dot"></span>
      <div class="alert-text">{{ successMsg }}</div>
    </div>

    <!-- Grid -->
    <div class="grid">
      <!-- userName -->
      <div class="field">
        <label for="userName">שם משתמש</label>
        <input
          id="userName"
          type="text"
          formControlName="userName"
          placeholder="לדוגמה: tamar123"
          [class.invalid]="form.controls.userName.touched && form.controls.userName.invalid"
        />

        <div class="hint" *ngIf="form.controls.userName.touched && form.controls.userName.invalid">
          <span *ngIf="form.controls.userName.hasError('required')">חובה להזין שם משתמש</span>
          <span *ngIf="form.controls.userName.hasError('minlength')">מינימום 3 תווים</span>
        </div>
      </div>

      <!-- name -->
      <div class="field">
        <label for="name">שם מלא</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="שם פרטי ומשפחה"
          [class.invalid]="form.controls.name.touched && form.controls.name.invalid"
        />

        <div class="hint" *ngIf="form.controls.name.touched && form.controls.name.invalid">
          <span *ngIf="form.controls.name.hasError('required')">חובה להזין שם מלא</span>
          <span *ngIf="form.controls.name.hasError('minlength')">מינימום 2 תווים</span>
        </div>
      </div>

      <!-- email -->
      <div class="field">
        <label for="email">אימייל</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="name@example.com"
          [class.invalid]="form.controls.email.touched && form.controls.email.invalid"
        />

        <div class="hint" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          <span *ngIf="form.controls.email.hasError('required')">חובה להזין אימייל</span>
          <span *ngIf="form.controls.email.hasError('email')">אימייל לא תקין</span>
        </div>
      </div>

      <!-- phone -->
      <div class="field">
        <label for="phone">טלפון (לא חובה)</label>
        <input id="phone" type="text" formControlName="phone" placeholder="050-0000000" />
      </div>

      <!-- address -->
      <div class="field full">
        <label for="address">כתובת (לא חובה)</label>
        <input id="address" type="text" formControlName="address" placeholder="עיר, רחוב, מספר" />
      </div>

      <!-- password -->
      <div class="field full">
        <label for="password">סיסמה</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="לפחות 6 תווים"
          [class.invalid]="form.controls.password.touched && form.controls.password.invalid"
        />

        <div class="hint" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          <span *ngIf="form.controls.password.hasError('required')">חובה להזין סיסמה</span>
          <span *ngIf="form.controls.password.hasError('minlength')">מינימום 6 תווים</span>
        </div>
      </div>
    </div>

    <!-- Footer buttons -->
    <div class="dialog-footer">
      <button type="button" class="btn ghost" (click)="reset()" [disabled]="loading">
        נקה
      </button>

      <button type="button" class="btn ghost" (click)="close()" [disabled]="loading">
        ביטול
      </button>

      <button type="submit" class="btn primary" [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        {{ loading ? 'שומר...' : 'הוספת תורם' }}
      </button>
    </div>
  </form>
</div>
