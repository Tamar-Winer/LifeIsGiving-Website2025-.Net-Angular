<div class="auth-bg">
  <div class="auth-card-container">
    <p-card styleClass="auth-card">
      <ng-template pTemplate="header">
        <div class="auth-header">
          <h2 class="shine-title">REGISTER</h2>
          <div class="header-divider"></div>
        </div>
      </ng-template>

      <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="submit()">
        
        <div class="form-row">
          <div class="field">
            <label>Username</label>
            <input pInputText class="w-full custom-input" formControlName="username" />
          </div>
          <div class="field">
            <label>Full Name</label>
            <input pInputText class="w-full custom-input" formControlName="name" />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Email</label>
            <input pInputText class="w-full custom-input" type="email" formControlName="email" />
          </div>
          <div class="field">
            <label>Phone</label>
            <input pInputText class="w-full custom-input" formControlName="phone" />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Address</label>
            <input pInputText class="w-full custom-input" formControlName="address" />
          </div>
          <div class="field">
            <label>Password</label>
            <p-password
              formControlName="password"
              [toggleMask]="true"
              [feedback]="false"
              inputStyleClass="w-full custom-input"
              styleClass="w-full"
            />
          </div>
        </div>

        <div class="form-actions">
          <button
            pButton
            type="submit"
            class="w-full auth-btn"
            label="CREATE ACCOUNT"
            [disabled]="registerForm.invalid"
          ></button>
        </div>

        <div class="links">
          <span>Already a member?</span>
          <a routerLink="/login">Sign In</a>
        </div>
      </form>
    </p-card>
  </div>
</div>
