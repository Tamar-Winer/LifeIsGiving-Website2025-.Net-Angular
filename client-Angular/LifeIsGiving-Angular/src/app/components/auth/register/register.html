<p-toast></p-toast> <div class="auth-bg">
  <div class="auth-card-container">
    <p-card styleClass="auth-card">
      <ng-template pTemplate="header">
        <div class="auth-header">
          <h2 class="shine-title">REGISTER</h2>
          <div class="header-divider"></div>
        </div>
      </ng-template>

      <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="submit()">
        
        <div class="form-row">
          <div class="field">
            <label>Username</label>
            <input pInputText class="w-full custom-input" formControlName="username" [class.ng-invalid]="hasError('username')" />
            <small class="error-text" *ngIf="hasError('username')">Username is required (min 3 chars)</small>
          </div>
          <div class="field">
            <label>Full Name</label>
            <input pInputText class="w-full custom-input" formControlName="name" [class.ng-invalid]="hasError('name')" />
            <small class="error-text" *ngIf="hasError('name')">Name is required</small>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Email</label>
            <input pInputText class="w-full custom-input" type="email" formControlName="email" [class.ng-invalid]="hasError('email')" />
            <small class="error-text" *ngIf="hasError('email')">Valid email is required</small>
          </div>
          <div class="field">
            <label>Phone</label>
            <input pInputText class="w-full custom-input" formControlName="phone" [class.ng-invalid]="hasError('phone')" />
            <small class="error-text" *ngIf="hasError('phone')">Invalid phone format</small>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Address</label>
            <input pInputText class="w-full custom-input" formControlName="address" [class.ng-invalid]="hasError('address')" />
            <small class="error-text" *ngIf="hasError('address')">Address is required</small>
          </div>
          <div class="field">
            <label>Password</label>
            <p-password
              formControlName="password"
              [toggleMask]="true"
              [feedback]="false"
              inputStyleClass="w-full custom-input"
              [styleClass]="'w-full ' + (hasError('password') ? 'ng-invalid' : '')"
            />
            <small class="error-text" *ngIf="hasError('password')">Min 6 characters required</small>
          </div>
        </div>

        <div class="form-actions">
          <button
            pButton
            type="submit"
            class="w-full auth-btn"
            [label]="loading ? 'PROCESSING...' : 'CREATE ACCOUNT'"
            [icon]="loading ? 'pi pi-spin pi-spinner' : ''"
            [disabled]="registerForm.invalid || loading"
          ></button>
        </div>

        <div class="links">
          <span>Already a member?</span>
          <a routerLink="/login">Sign In</a>
        </div>
      </form>
    </p-card>
  </div>
</div>
