<p-toast position="top-center" [baseZIndex]="9999"></p-toast>

<div class="auth-bg">
  <div class="auth-card-container">
    <p-card styleClass="auth-card">
      <ng-template pTemplate="header">
        <div class="auth-header">
          <h2 class="shine-title">LOGIN</h2>
          <div class="header-divider"></div>
        </div>
      </ng-template>

      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="submit()">

        <div class="field">
          <label>Username</label>
          <input pInputText class="w-full custom-input" formControlName="username" placeholder="Enter your username" />
          @if (hasError('username')) {
            <small class="error-text">Required: minimum 3 characters</small>
          }
        </div>

        <div class="field">
          <label>Password</label>
          <p-password
            formControlName="password"
            [toggleMask]="true"
            [feedback]="false"
            inputStyleClass="w-full custom-input"
            styleClass="w-full"
            placeholder="Enter your password"
          />
          @if (hasError('password')) {
            <small class="error-text">Required: minimum 6 characters</small>
          }
        </div>

        <div class="form-actions">
          <button
            pButton
            type="submit"
            class="w-full auth-btn"
            label="SIGN IN"
            [disabled]="loginForm.invalid"
          ></button>
        </div>

        <div class="links">
          <span>Don't have an account?</span>
          <a routerLink="/register">Register Now</a>
        </div>
      </form>
    </p-card>
  </div>
</div>
